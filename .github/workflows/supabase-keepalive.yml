name: Supabase Keep-Alive

# Supabase ÜCRETSIZ plan, 7 gün istek gelmezse projeyi otomatik duraklatır.
# Bu iş akışı 2 günde bir 3 Supabase projesine küçük bir istek (/auth/v1/health)
# atarak hepsini "uyanık" tutar. LeanSys'e DOKUNMAZ; sadece HTTP health çağrısı.
#
# Kapsanan projeler:
#   - CMMS Bakım            -> bgraqliedgmksqdbddkp  (mycosmosshop org)
#   - Kalite+Doküman+DÖF+8D+PFMEA -> nnubrxbpthmkitueixbh  (cosmositio org)
#   - ERP Portal            -> chchaielttnimuuezazb  (cosmositio org)
#
# Anon/publishable anahtarlar zaten genel (public) uygulama HTML'lerinde gömülü
# olduğundan burada düz yazılması ek bir güvenlik açığı oluşturmaz.
#
# GÖRÜNÜRLÜK: Her çalışma "Actions" sekmesinde görünür (✅/❌ özet). Bir proje
# yanıt vermezse iş BAŞARISIZ olur -> GitHub repo sahibine OTOMATIK e-posta atar.
# Yani: ses yoksa her şey yolunda; e-posta gelirse bir projede sorun var demektir.

on:
  schedule:
    # HER GÜN. 7 gunluk pause penceresinde 7 sans olur; 2 gunde bir olsaydi
    # ust uste 3 kacirilan calisma projeyi duraklatmaya yeterdi.
    - cron: '0 6 * * *'
  workflow_dispatch:          # "Run workflow" ile elle de çalıştırılabilir
  push:                       # her push'ta da calis (cron devre disi kalirsa yedek)
    branches: [main]
    paths-ignore: ['.keepalive-stamp']   # kendi damga commit'i sonsuz dongu yapmasin

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # aylik damga commit'i icin
    steps:
      - uses: actions/checkout@v4
      - name: Tüm Supabase projelerini ping'le
        run: |
          set -u
          # NOT: /auth/v1/health VERITABANINA DOKUNMAZ -> Supabase bunu "aktivite"
          # saymaz ve proje yine duraklatilir (2026-07-28'de CMMS boyle duraklatildi).
          # Bu yuzden PostgREST uzerinden GERCEK bir tablo sorgusu atiyoruz.
          # RLS bos dizi dondurebilir; onemli olan Postgres'e istek gitmesi (HTTP 200).
          LIST=(
            "CMMS-Bakim|bgraqliedgmksqdbddkp|cmms_data|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJncmFxbGllZGdta3NxZGJkZGtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzODA4MDEsImV4cCI6MjA5NTk1NjgwMX0.htOoBiFUfUsUgkUrbB0BZEanZR5lioYjJYVjobo2oO0"
            "Kalite-Dokuman-DOF-8D|nnubrxbpthmkitueixbh|uretim_ozet|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5udWJyeGJwdGhta2l0dWVpeGJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjI2MDIsImV4cCI6MjA5NjEzODYwMn0.CHZUOylf_q8kkOQbFf9VWZ6-doUTlynmAhahM2EuImE"
            "ERP-Portal|chchaielttnimuuezazb|erp_users|sb_publishable_S2ywbq7TkgcZKiVif3td-A_oAuQL3QT"
          )
          FAIL=0
          echo "=== Supabase Keep-Alive | $(date -u '+%Y-%m-%d %H:%M UTC') ==="
          for row in "${LIST[@]}"; do
            NAME="${row%%|*}"; rest="${row#*|}"
            REF="${rest%%|*}"; rest="${rest#*|}"
            TBL="${rest%%|*}"; KEY="${rest#*|}"
            # 3 deneme: gecici 5xx/aglayan istek yuzunden yanlis alarm e-postasi
            # gelmesin (yanlis alarm, gercek alarmi da gormezden gelmeye alistirir).
            for try in 1 2 3; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                "https://$REF.supabase.co/rest/v1/$TBL?select=*&limit=1" \
                -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || echo 000)
              [ "$CODE" = "200" ] && break
              [ "$try" != "3" ] && sleep 20
            done
            if [ "$CODE" = "200" ]; then
              echo "✅ $NAME ($REF): HTTP $CODE — aktif tutuldu"
            else
              echo "❌ $NAME ($REF): HTTP $CODE — YANIT YOK / SORUN!"
              FAIL=1
            fi
          done
          echo "================================================="
          if [ "$FAIL" = "1" ]; then
            echo "En az bir proje yanit vermedi — kontrol et!"
            exit 1
          fi
          echo "Tum projeler aktif. ✔"

      # GitHub, 60 gun hic commit gelmeyen repolarda zamanlanmis workflow'lari
      # otomatik devre disi birakir -> ping durur -> Supabase yine duraklatir.
      # Ayda bir kucuk damga commit'i atarak repoyu "aktif" tutuyoruz.
      - name: Repoyu canli tut (aylik damga)
        run: |
          STAMP=$(date -u +%Y-%m)
          [ "$(cat .keepalive-stamp 2>/dev/null)" = "$STAMP" ] && { echo "Bu ay zaten damgalanmis: $STAMP"; exit 0; }
          echo "$STAMP" > .keepalive-stamp
          git config user.name  "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive-stamp
          git commit -m "keepalive damgasi: $STAMP [skip ci]"
          git push
          echo "Repo damgalandi: $STAMP"
